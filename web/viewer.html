<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookaround viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #panel {
    position: fixed; left: 12px; top: 12px; z-index: 2; background: rgba(0,0,0,.6);
    padding: 10px 12px; border-radius: 10px; max-width: min(380px, calc(100% - 24px));
  }
  #status { margin: 0 0 6px; }
  #status.error { color: #ff9b94; }
  #details { color: #aaa; font-size: 12px; margin: 0 0 8px; }
  #panel button, #panel a {
    background: #2f6fdb; color: #fff; border: 0; border-radius: 7px; padding: 6px 10px;
    font: inherit; cursor: pointer; text-decoration: none; margin-right: 6px; display: inline-block;
  }
  #panel a { background: transparent; border: 1px solid #555; }
  #bar { height: 4px; background: #333; border-radius: 4px; overflow: hidden; margin: 0 0 8px; }
  #bar > div { height: 100%; width: 0; background: #6b9cf0; }
  #panel button.on { background: #2a8a4a; }
  #sr3d { margin-top: 10px; border-top: 1px solid #444; padding-top: 8px; font-size: 13px; }
  #sr3d label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #sr3d input[type="range"] { flex: 1; }
  #sr3d select { background: #222; color: #eee; border: 1px solid #555; border-radius: 5px; font: inherit; }
  #srStatus.warn { color: #ffc46b; }
  #srStatus.error { color: #ff9b94; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="panel">
  <p id="status">Loading splat…</p>
  <div id="bar"><div></div></div>
  <p id="details"></p>
  <button id="home" type="button">Photo view</button>
  <button id="sr" type="button" title="Glasses-free 3D on an SR display (Acer SpatialLabs, Samsung Odyssey 3D)">3D display</button>
  <a id="back" href="/">Back</a>
  <div id="sr3d" hidden>
    <p id="srStatus" style="margin:0 0 4px"></p>
    <label>Depth <input id="srDepth" type="range" min="0.3" max="2" step="0.05" value="1"></label>
    <label>Detail <select id="srScale">
      <option value="0.5">Half</option><option value="0.75">Three quarters</option><option value="1">Full</option>
    </select></label>
    <label>Test <select id="srPattern">
      <option value="0">Off</option><option value="2">Left red, right blue</option><option value="1">Left white, right black</option>
    </select></label>
    <label><input id="srSwap" type="checkbox"> Swap eyes</label>
    <div style="color:#aaa">At depth 1 the subject is level with the screen; lower sets it back behind the glass,
      higher brings it out towards you. H hides this panel; Esc leaves 3D.</div>
  </div>
</div>
<script type="module">
  import * as THREE from "three";
  import { TrackballControls } from "three/addons/controls/TrackballControls.js";
  import { VRButton } from "three/addons/webxr/VRButton.js";
  import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
  import { LenticularRenderer, SRStream, enterFullscreen } from "./lenticular.js";

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const run = params.get("run");
  const splatUrl = params.get("splat") || `/runs/${run}/splat/splat.ply`;
  const metaUrl = splatUrl.replace(/\.ply$/, ".json");
  if (run) $("back").href = `/#${run}`;

  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  // In a headset, start with the head where the photo's camera was.
  renderer.xr.setReferenceSpaceType("local");
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  // AnySplat's world is its first view's camera with OpenCV axes (x right, y down, z forward).
  // A half turn about x gives three.js axes (y up, z back), so the photo's camera sits at the
  // origin looking down -z: three.js's default camera.
  const world = new THREE.Group();
  world.quaternion.set(1, 0, 0, 0);
  scene.add(world);

  const meta = await fetch(metaUrl).then((r) => (r.ok ? r.json() : null)).catch(() => null);

  const splat = new SplatMesh({
    url: splatUrl,
    onProgress: (event) => {
      if (event.lengthComputable) {
        const percent = (100 * event.loaded) / event.total;
        $("bar").firstElementChild.style.width = `${percent}%`;
        $("status").textContent = `Loading splat… ${(event.loaded / 1e6).toFixed(0)} of ${(event.total / 1e6).toFixed(0)} MB`;
      }
    },
  });
  if (meta) {
    // Re-anchor on the first camera in case AnySplat left it slightly off the origin.
    const c2w = new THREE.Matrix4().set(...meta.cameras[0].c2w.flat());
    c2w.invert().decompose(splat.position, splat.quaternion, splat.scale);
  }
  world.add(splat);
  world.updateMatrixWorld(true);

  // Pivot: the point the orbit's cameras all look at, else straight ahead at the subject depth.
  const pivot = meta && meta.pivot
    ? new THREE.Vector3(...meta.pivot).applyMatrix4(splat.matrixWorld)
    : new THREE.Vector3(0, 0, -(meta ? meta.subject_depth : 1));
  const radius = pivot.length();

  camera.fov = meta ? meta.fov_y_degrees : 50;
  camera.near = radius * 0.01;
  camera.far = radius * 200;
  camera.position.set(0, 0, 0);
  camera.updateProjectionMatrix();

  // Free movement in all six degrees: the trackball turns the view any way round the target
  // (over the top, and rolling when you drag around the edge of the window), right-drag pans,
  // the wheel moves in and out, and the keyboard flies.
  const controls = new TrackballControls(camera, renderer.domElement);
  controls.target.copy(pivot);
  controls.rotateSpeed = 2.5;
  controls.zoomSpeed = 1.2;
  controls.panSpeed = 0.6;
  controls.dynamicDampingFactor = 0.15;
  controls.minDistance = radius * 0.02;
  controls.maxDistance = radius * 20;
  controls.keys = [null, null, null];  // its A/S/D drag modifiers would clash with flying
  controls.update();
  // reset() returns to the state saved when the controls were made, before the target was
  // set: make that the photo view. (These fields are internal to three 0.180, pinned above.)
  controls._target0.copy(controls.target);
  controls._position0.copy(camera.position);
  controls._up0.copy(camera.up);
  const home = { position: camera.position.clone(), quaternion: camera.quaternion.clone(), target: pivot.clone() };

  // Flying: W/S forward and back, A/D left and right, Q/E down and up, all relative to the
  // view, moving the target along with the camera. Shift goes three times as fast.
  const FLY_KEYS = { KeyW: [0, 0, -1], KeyS: [0, 0, 1], KeyA: [-1, 0, 0], KeyD: [1, 0, 0], KeyQ: [0, -1, 0], KeyE: [0, 1, 0] };
  const held = new Set();
  window.addEventListener("keydown", (event) => {
    if (event.code in FLY_KEYS) held.add(event.code);
    if (event.code === "ShiftLeft" || event.code === "ShiftRight") held.add("Shift");
    if (event.code === "KeyR" || event.code === "Home") flyHome();
    if (event.code === "KeyH" && sr.on) $("panel").hidden = !$("panel").hidden;
  });
  window.addEventListener("keyup", (event) => {
    held.delete(event.code);
    if (event.code === "ShiftLeft" || event.code === "ShiftRight") held.delete("Shift");
  });
  window.addEventListener("blur", () => held.clear());

  function fly(seconds) {
    const move = new THREE.Vector3();
    for (const code of held) if (FLY_KEYS[code]) move.add(new THREE.Vector3(...FLY_KEYS[code]));
    if (!move.lengthSq()) return;
    const speed = radius * 0.6 * (held.has("Shift") ? 3 : 1);
    move.normalize().multiplyScalar(speed * seconds).applyQuaternion(camera.quaternion);
    camera.position.add(move);
    controls.target.add(move);
  }

  // Back to the photo view: an eased one-second glide, then an exact reset (which also stops
  // any trackball spin still coasting).
  const TWEEN_SECONDS = 1;
  let tween = null;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);  // ease in-out cubic
  function flyHome() {
    if (tween) return;
    controls.enabled = false;
    tween = { start: performance.now(), position: camera.position.clone(),
              quaternion: camera.quaternion.clone(), target: controls.target.clone() };
  }
  function stepTween(now) {
    const t = Math.min(1, (now - tween.start) / (TWEEN_SECONDS * 1000));
    const k = ease(t);
    camera.position.lerpVectors(tween.position, home.position, k);
    camera.quaternion.slerpQuaternions(tween.quaternion, home.quaternion, k);
    controls.target.lerpVectors(tween.target, home.target, k);
    camera.up.set(0, 1, 0).applyQuaternion(camera.quaternion);
    if (t === 1) {
      tween = null;
      controls.reset();
      controls.enabled = true;
    }
  }
  $("home").addEventListener("click", flyHome);

  if (meta) {
    $("details").textContent = `${meta.gaussians.toLocaleString()} Gaussians from ${meta.frames.length} orbit frames. ` +
      "Drag to turn (round the edge to roll), right-drag to pan, scroll to move in, " +
      "WASD/QE to fly (Shift for faster), R for the photo view.";
  }

  splat.initialized
    .then(() => {
      $("status").textContent = "Splat loaded";
      $("bar").style.display = "none";
    })
    .catch((error) => {
      $("status").className = "error";
      $("status").textContent = `Could not load ${splatUrl}: ${error.message || error}`;
    });

  // 3D display mode: the SR helper switches the display's lens on and streams the eyes; the view
  // is rendered for each eye and woven at the screen's full resolution (see lenticular.js).
  const sr = { on: false, stream: new SRStream(), lenticular: new LenticularRenderer(renderer) };
  const pixelRatio = () => (sr.on ? window.devicePixelRatio : Math.min(window.devicePixelRatio, 2));

  function srStatus() {
    const el = $("srStatus");
    const { stream } = sr;
    const buffer = renderer.getDrawingBufferSize(new THREE.Vector2());
    let text, kind = "";
    if (stream.error) {
      text = `No SR display: ${stream.error}`;
      kind = "error";
    } else if (!stream.screen) {
      text = "Switching the lens on…";
    } else if (!document.fullscreenElement) {
      text = "Not fullscreen: the 3D only lines up fullscreen on the SR display.";
      kind = "warn";
    } else if (buffer.x !== stream.screen.columns || buffer.y !== stream.screen.rows) {
      text = `This screen is ${buffer.x}×${buffer.y}, not the SR display's ${stream.screen.columns}×` +
        `${stream.screen.rows}: move the window onto it (and set the browser's zoom to 100%).`;
      kind = "warn";
    } else {
      text = stream.tracking ? "3D on, tracking your eyes" : "3D on, but no eyes in view of the camera";
      kind = stream.tracking ? "" : "warn";
    }
    el.textContent = text;
    el.className = kind;
  }
  sr.stream.onchange = srStatus;

  async function startSR() {
    sr.on = true;
    $("sr").classList.add("on");
    $("sr3d").hidden = false;
    sr.stream.open();
    srStatus();
    // Fullscreen needs the click's user activation, so ask now; the stream's first message (the
    // screen's size, to find the right screen) can't be waited for.
    try {
      await enterFullscreen(document.documentElement, sr.stream);
    } catch {
      // refused: the status says so
    }
  }

  function stopSR() {
    sr.on = false;
    sr.stream.close();
    $("sr").classList.remove("on");
    $("sr3d").hidden = true;
    $("panel").hidden = false;
    if (document.fullscreenElement) document.exitFullscreen();
    resize();
  }

  $("sr").addEventListener("click", () => (sr.on ? stopSR() : startSR()));
  document.addEventListener("fullscreenchange", () => {
    if (sr.on && !document.fullscreenElement) stopSR();
    resize();
  });
  $("srDepth").addEventListener("input", (e) => (sr.lenticular.screenDepth = +e.target.value));
  $("srScale").addEventListener("change", (e) => (sr.lenticular.renderScale = +e.target.value));
  $("srPattern").addEventListener("change", (e) => (sr.lenticular.pattern = +e.target.value));
  $("srSwap").addEventListener("change", (e) => (sr.lenticular.swapEyes = e.target.checked));

  function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (sr.on) srStatus();
  }
  window.addEventListener("resize", resize);

  const clock = new THREE.Clock();
  renderer.setAnimationLoop((now) => {
    const seconds = Math.min(clock.getDelta(), 0.1);
    if (!renderer.xr.isPresenting) {
      if (tween) {
        stepTween(now);
      } else {
        fly(seconds);
        controls.update();
      }
    }
    if (sr.on && sr.stream.ready && !renderer.xr.isPresenting) {
      sr.lenticular.render(scene, camera, spark, camera.position.distanceTo(controls.target), sr.stream);
    } else {
      renderer.render(scene, camera);
    }
  });
</script>
</body>
</html>
